name: Sync Local DB to AWS RDS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sync" to confirm database sync to RDS'
        required: true
        default: ''

jobs:
  sync-db:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'sync' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync DB to RDS via EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/app

            # Pull latest code (includes updated db dump)
            git pull origin main

            # Run the container sync pipeline
            export UNIVERSITIES_DATABASE_URL="${{ secrets.UNIVERSITIES_DATABASE_URL }}"
            bash sync_db_to_rds_container.sh
