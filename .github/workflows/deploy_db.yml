name: Deploy Database Dump to AWS RDS

on:
  push:
    paths:
      - 'db_dumps/**' # Triggers only when files inside db_dumps/ folder are updated
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy_db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Database Deployment
        env:
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_HOST: "database-1.czo2ggw2c7f3.ap-south-1.rds.amazonaws.com"
          RDS_DB: "universities_db"
        run: |
          echo "Connecting to AWS RDS to recreate database schema..."
          PGPASSWORD="$RDS_PASSWORD" psql -h "$RDS_HOST" -U "$RDS_USER" -d postgres -c "DROP DATABASE IF EXISTS $RDS_DB;"
          PGPASSWORD="$RDS_PASSWORD" psql -h "$RDS_HOST" -U "$RDS_USER" -d postgres -c "CREATE DATABASE $RDS_DB;"
          
          # Restore the dump file from the repository path
          if [ -f "db_dumps/universities_db.sql" ]; then
            echo "Restoring plain-text SQL schema..."
            PGPASSWORD="$RDS_PASSWORD" psql -h "$RDS_HOST" -U "$RDS_USER" -d "$RDS_DB" -f db_dumps/universities_db.sql
          elif [ -f "db_dumps/universities_db.dump" ]; then
            echo "Restoring custom compressed binary dump..."
            PGPASSWORD="$RDS_PASSWORD" pg_restore -h "$RDS_HOST" -U "$RDS_USER" -d "$RDS_DB" -v db_dumps/universities_db.dump
          else
            echo "ERROR: No database dump file found in db_dumps/ folder."
            exit 1
          fi
          echo "Database deployment completed successfully!"
