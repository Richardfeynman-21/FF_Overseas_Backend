    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;

    # SSL Configuration (Replace with actual paths to certificates in production)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
