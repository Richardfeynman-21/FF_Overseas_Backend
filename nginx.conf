# Fly & Flourish Nginx Configuration
# Routes traffic between the Next.js frontend, Rust Axum backend, and Python server.

upstream frontend_server {
    server 127.0.0.1:3000;
}

upstream backend_rust_server {
    server 127.0.0.1:8080;
}

upstream python_ai_server {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Maximum upload size for documents (aligns with the 25 MB limit)
    client_max_body_size 25M;

    # Rust backend Axum server routes
    location ~ ^/api/(auth|students|agents|admin|applications|documents|chat) {
        proxy_pass http://backend_rust_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket connection upgrading for chat
    location /ws/chat {
        proxy_pass http://backend_rust_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # Keep WebSocket connection open
    }

    # Python AI server routes (University search, Chatbot)
    location ~ ^/api/(universities|public-chat) {
        proxy_pass http://python_ai_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default fallback to Next.js frontend
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS server block template
